# Builds the Our Faithful Screens app for Google TV / Android TV (church-platform/android-tv).
# Every run makes a debug APK to sideload for testing. When the signing secrets are set, it also makes the signed
# release bundle (.aab) for Google Play and a signed APK for installing on church TVs directly.
name: Our Faithful Screens (Google TV)

on:
  push:
    branches: [main]
    paths: ["church-platform/android-tv/**", ".github/workflows/our-faithful-screens-tv.yml"]
  pull_request:
    paths: ["church-platform/android-tv/**", ".github/workflows/our-faithful-screens-tv.yml"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the Play Store (like 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: church-platform/android-tv
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the test app (debug APK)
        run: ./gradlew --no-daemon assembleDebug

      - name: Get the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No signing key set yet: skipping the release build."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Build the release (Play bundle and signed APK)
        if: steps.key.outputs.ok == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: our-faithful-screens-debug
          path: church-platform/android-tv/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: our-faithful-screens-release
          path: |
            church-platform/android-tv/app/build/outputs/bundle/release/*.aab
            church-platform/android-tv/app/build/outputs/apk/release/*.apk

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
